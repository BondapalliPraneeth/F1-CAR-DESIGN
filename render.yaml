# Render Blueprint for the backend API. Secrets are declared with `sync: false`, so they are
# entered in the Render dashboard and never stored in this repository.
services:
  - type: web
    name: apexvision-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: auto
      - key: AI_RATE_LIMIT_PER_MINUTE
        value: "12"
      - key: DATABASE_URL # Neon connection string (postgresql://...?sslmode=require)
        sync: false
      - key: CORS_ORIGINS # e.g. https://apexvision.vercel.app
        sync: false
      - key: GEMINI_API_KEY # optional
        sync: false
      - key: OPENAI_API_KEY # optional
        sync: false
      - key: GROQ_API_KEY # optional, https://console.groq.com/keys
        sync: false
